<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ScoutSummoners</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#strings.equals(activePage, 'dashboard')} ? 'active' : ''" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#strings.equals(activePage, 'events')} ? 'active' : ''" th:href="@{/events}">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#strings.equals(activePage, 'calendar')} ? 'active' : ''" th:href="@{/calendar}">Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#strings.equals(activePage, 'surveys')} ? 'active' : ''" th:href="@{/surveys}">Time Surveys</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" th:classappend="${#strings.equals(activePage, 'large-event-planning')} ? 'active' : ''" href="#" id="largeEventDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Large Event Planning
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="largeEventDropdown">
                            <li><a class="dropdown-item" th:href="@{/large-event-planning}">Overview</a></li>
                            <li><hr class="dropdown-divider" th:if="${userPlans != null && !userPlans.empty}"></li>
                            <li th:each="plan : ${userPlans}">
                                <a class="dropdown-item" th:href="@{/large-event-planning/{id}(id=${plan.id})}" th:text="${plan.name}"></a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="navbar-text me-3">Welcome, <span th:text="${user.username}"></span>!</span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
