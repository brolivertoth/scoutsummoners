<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - ScoutSummoners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ScoutSummoners</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/calendar}">Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/surveys}">Time Surveys</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="largeEventDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Large Event Planning
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="largeEventDropdown">
                            <li><a class="dropdown-item" th:href="@{/large-event-planning}">Overview</a></li>
                            <li><hr class="dropdown-divider" th:if="${userPlans != null && !userPlans.empty}"></li>
                            <li th:each="plan : ${userPlans}">
                                <a class="dropdown-item" th:href="@{/large-event-planning/{id}(id=${plan.id})}" th:text="${plan.name}"></a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="navbar-text me-3">Welcome!</span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Edit Event</h2>
                        
                        <form th:action="@{/events/{id}/update(id=${event.id})}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">Event Title</label>
                                <input type="text" class="form-control" id="title" name="title" th:value="${event.title}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" required th:text="${event.description}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="startTime" class="form-label">Start Time</label>
                                <input type="datetime-local" class="form-control" id="startTime" name="startTime" 
                                       th:value="${#temporals.format(event.startTime, 'yyyy-MM-dd\'T\'HH:mm')}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="endTime" class="form-label">End Time</label>
                                <input type="datetime-local" class="form-control" id="endTime" name="endTime" 
                                       th:value="${#temporals.format(event.endTime, 'yyyy-MM-dd\'T\'HH:mm')}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="location" class="form-label">Location (Optional)</label>
                                <input type="text" class="form-control" id="location" name="location" th:value="${event.location}">
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Update Event</button>
                                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
