<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - ScoutSummoners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/calendar.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(activePage='calendar')}"></div>

    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prevMonth" class="btn btn-primary">
                <i class="bi bi-chevron-left"></i> Previous
            </button>
            <h2 id="monthYear"></h2>
            <button id="nextMonth" class="btn btn-primary">
                Next <i class="bi bi-chevron-right"></i>
            </button>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <div class="calendar-day-header">Sunday</div>
            <div class="calendar-day-header">Monday</div>
            <div class="calendar-day-header">Tuesday</div>
            <div class="calendar-day-header">Wednesday</div>
            <div class="calendar-day-header">Thursday</div>
            <div class="calendar-day-header">Friday</div>
            <div class="calendar-day-header">Saturday</div>
            <!-- Days will be inserted here by JavaScript -->
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="eventModalTitle">Events</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="eventModalBody">
                    <!-- Events will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="addEventBtn">
                        <i class="bi bi-plus-circle"></i> Add Event
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div class="modal fade" id="addEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="quickEventForm">
                        <div class="mb-3">
                            <label for="eventTitle" class="form-label">Event Title</label>
                            <input type="text" class="form-control" id="eventTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="eventDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="eventStartTime" class="form-label">Start Time</label>
                            <input type="time" class="form-control" id="eventStartTime" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventEndTime" class="form-label">End Time</label>
                            <input type="time" class="form-control" id="eventEndTime" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventLocation" class="form-label">Location (Optional)</label>
                            <input type="text" class="form-control" id="eventLocation">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Event Visibility</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="openToAll" id="eventOpenToAllYes" value="true" checked>
                                <label class="form-check-label" for="eventOpenToAllYes">
                                    Open to All Users
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="openToAll" id="eventOpenToAllNo" value="false">
                                <label class="form-check-label" for="eventOpenToAllNo">
                                    Invite Specific Users
                                </label>
                            </div>
                        </div>

                        <div class="mb-3" id="eventInviteUsersSection" style="display: none;">
                            <label class="form-label">Invite Users</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" id="eventUserSearchInput" placeholder="Type username to search..." autocomplete="off">
                                <div id="eventUserSearchResults" class="list-group position-absolute w-100" style="z-index: 1000; max-height: 200px; overflow-y: auto; display: none;"></div>
                            </div>
                            <div id="eventSelectedUsersContainer" class="mt-2">
                                <!-- Selected users will appear here as badges -->
                            </div>
                        </div>

                        <input type="hidden" id="selectedDate">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEventBtn">Create Event</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const allUsers = /*[[${allUsers}]]*/ [];
    </script>
    <script th:src="@{/js/calendar.js}"></script>
</body>
</html>
