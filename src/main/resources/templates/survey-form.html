<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Survey - ScoutSummoners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(activePage='surveys')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Create Time Slot Survey</h2>
                        <p class="text-muted">Create a survey to find the best time for your event with friends.</p>
                        
                        <form id="surveyForm" th:action="@{/surveys/create}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">Survey Title</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Survey Visibility</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="openToAll" id="openToAllYes" value="true" checked>
                                    <label class="form-check-label" for="openToAllYes">
                                        Open to All Users
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="openToAll" id="openToAllNo" value="false">
                                    <label class="form-check-label" for="openToAllNo">
                                        Invite Specific Users
                                    </label>
                                </div>
                            </div>

                            <div class="mb-3" id="inviteUsersSection" style="display: none;">
                                <label class="form-label">Invite Users</label>
                                <div class="position-relative">
                                    <input type="text" class="form-control" id="userSearchInput" placeholder="Type username to search..." autocomplete="off">
                                    <div id="userSearchResults" class="list-group position-absolute w-100" style="z-index: 1000; max-height: 200px; overflow-y: auto; display: none;"></div>
                                </div>
                                <div id="selectedUsersContainer" class="mt-2">
                                    <!-- Selected users will appear here as badges -->
                                </div>
                                <!-- Hidden inputs for form submission -->
                                <div id="invitedUsersInputs"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Time Slot Options</label>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="globalHasEndTime" checked>
                                    <label class="form-check-label" for="globalHasEndTime">
                                        <strong>Include End Times for all slots</strong>
                                    </label>
                                </div>
                                <div id="timeSlotsContainer">
                                    <!-- Time slots will be added here -->
                                </div>
                                <button type="button" class="btn btn-secondary btn-sm mt-2" id="addTimeSlot">
                                    <i class="bi bi-plus"></i> Add Time Slot
                                </button>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Create Survey</button>
                                <a th:href="@{/surveys}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const allUsers = /*[[${allUsers}]]*/ [];
    </script>
    <script th:src="@{/js/survey-form.js}"></script>
</body>
</html>
