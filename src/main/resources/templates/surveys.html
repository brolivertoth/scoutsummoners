<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Slot Surveys - ScoutSummoners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(activePage='surveys')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Time Slot Surveys</h2>
            <a th:href="@{/surveys/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Create Survey
            </a>
        </div>

        <div th:if="${surveys.empty}" class="alert alert-info">
            No surveys yet. Create one to find the best time with your friends!
        </div>

        <div class="row">
            <div th:each="survey : ${surveys}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title" th:text="${survey.title}">Survey Title</h5>
                            <span th:if="${survey.closed}" class="badge bg-secondary">Closed</span>
                            <span th:unless="${survey.closed}" class="badge bg-success">Active</span>
                        </div>
                        <p class="card-text" th:text="${survey.description}">Survey Description</p>
                        <p class="card-text">
                            <small>
                                <i class="bi bi-person"></i> 
                                Created by <span th:text="${survey.creator.username}"></span>
                            </small>
                        </p>
                        <p class="card-text">
                            <small>
                                <i class="bi bi-clock"></i> 
                                <span th:text="${survey.timeSlots.size()}"></span> time slot(s)
                            </small>
                        </p>
                        <p th:if="${survey.createdEvent != null}" class="card-text">
                            <small class="text-success">
                                <i class="bi bi-check-circle"></i> Event created
                            </small>
                        </p>
                        <a th:href="@{/surveys/{id}(id=${survey.id})}" class="btn btn-sm btn-primary">View & Vote</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
