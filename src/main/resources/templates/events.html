<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - ScoutSummoners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(activePage='events')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Your Events</h2>
            <a th:href="@{/events/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Create Event
            </a>
        </div>

        <div th:if="${events.empty}" class="alert alert-info">
            You don't have any events yet. Create your first event!
        </div>

        <div class="row">
            <div th:each="event : ${events}" class="col-md-6 col-lg-4 mb-4">
                <div class="card event-card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                        <p class="card-text" th:text="${event.description}">Event Description</p>
                        <p class="card-text">
                            <small>
                                <i class="bi bi-calendar"></i>
                                <span th:text="${#temporals.format(event.startTime, 'dd MMM yyyy HH:mm')}"></span>
                            </small>
                        </p>
                        <p class="card-text" th:if="${event.location}">
                            <small><i class="bi bi-geo-alt"></i> <span th:text="${event.location}"></span></small>
                        </p>
                        <p class="card-text">
                            <small>
                                <i class="bi bi-people"></i>
                                <span th:text="${event.participants.size() + 1}"></span> participant(s)
                            </small>
                        </p>
                        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
