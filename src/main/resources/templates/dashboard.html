<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ScoutSummoners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(activePage='dashboard')}"></div>

    <div class="container mt-4">
        <h2 class="mb-4">Dashboard</h2>

        <div class="row">
            <!-- Upcoming Events Widget -->
            <div class="col-lg-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-calendar-event"></i> Upcoming Events (Next 30 Days)</h5>
                        <a th:href="@{/events}" class="btn btn-sm btn-light">View All</a>
                    </div>
                    <div class="card-body">
                        <div th:if="${upcomingEvents.empty}" class="text-muted">
                            No upcoming events in the next 30 days.
                        </div>
                        <div th:if="${!upcomingEvents.empty}">
                            <div th:each="event : ${upcomingEvents}" class="mb-3 pb-3 border-bottom">
                                <h6 class="mb-1">
                                    <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}" class="text-decoration-none"></a>
                                </h6>
                                <small class="text-muted">
                                    <i class="bi bi-calendar"></i>
                                    <span th:text="${#temporals.format(event.startTime, 'dd MMM yyyy HH:mm')}"></span>
                                </small>
                                <br>
                                <small th:if="${event.location}" class="text-muted">
                                    <i class="bi bi-geo-alt"></i>
                                    <span th:text="${event.location}"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Open Surveys Widget -->
            <div class="col-lg-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-clipboard-check"></i> Open Time Surveys</h5>
                        <a th:href="@{/surveys}" class="btn btn-sm btn-light">View All</a>
                    </div>
                    <div class="card-body">
                        <div th:if="${openSurveys.empty}" class="text-muted">
                            No open surveys available.
                        </div>
                        <div th:if="${!openSurveys.empty}">
                            <div th:each="survey : ${openSurveys}" class="mb-3 pb-3 border-bottom">
                                <h6 class="mb-1">
                                    <a th:href="@{/surveys/{id}(id=${survey.id})}" th:text="${survey.title}" class="text-decoration-none"></a>
                                </h6>
                                <small class="text-muted">
                                    <i class="bi bi-person"></i> Created by <span th:text="${survey.creator.username}"></span>
                                </small>
                                <br>
                                <small class="text-muted">
                                    <i class="bi bi-clock"></i>
                                    <span th:text="${#temporals.format(survey.createdAt, 'dd MMM yyyy')}"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Large Event Plans Widget -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-diagram-3"></i> Your Large Event Plans</h5>
                        <a th:href="@{/large-event-planning}" class="btn btn-sm btn-light">View All</a>
                    </div>
                    <div class="card-body">
                        <div th:if="${largeEventPlans.empty}" class="text-muted">
                            You're not part of any large event plans yet.
                        </div>
                        <div th:if="${!largeEventPlans.empty}" class="row">
                            <div th:each="plan : ${largeEventPlans}" class="col-md-6 col-lg-4 mb-3">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <h6 class="card-title">
                                            <a th:href="@{/large-event-planning/{id}(id=${plan.id})}" th:text="${plan.name}" class="text-decoration-none"></a>
                                        </h6>
                                        <p class="card-text small text-muted" th:text="${plan.description}"></p>
                                        <small class="text-muted">
                                            <i class="bi bi-person"></i>
                                            <span th:text="${plan.creator.username}"></span>
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0"><i class="bi bi-lightning"></i> Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/events/new}" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Create Event
                            </a>
                            <a th:href="@{/surveys/new}" class="btn btn-success">
                                <i class="bi bi-clipboard-plus"></i> Create Survey
                            </a>
                            <a th:href="@{/calendar}" class="btn btn-info">
                                <i class="bi bi-calendar"></i> View Calendar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
