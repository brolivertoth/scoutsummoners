spring.application.name=ScoutSummoners

# Azure SQL Database Configuration
spring.datasource.url=jdbc:sqlserver://${AZURE_SQL_SERVER:XXXX}:1433;database=${AZURE_SQL_DATABASE:XXXX};encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=${AZURE_SQL_USER:XXXX}
spring.datasource.password=${AZURE_SQL_PASSWORD:XXXX}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Security
spring.security.user.name=${SPRING_SECURITY_USER:XXXX}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:XXXX}

# Google reCAPTCHA Configuration
# Get your keys from: https://www.google.com/recaptcha/admin
recaptcha.site-key=${RECAPTCHA_SITE_KEY:XXXX}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:XXXX}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Mailer To Go Email Configuration (for Heroku deployment)
# For Heroku: These are set automatically when you add the Mailer To Go addon
# For local development: Get values from: heroku config
spring.mail.host=${MAILERTOGO_SMTP_HOST:XXXX}
spring.mail.port=${MAILERTOGO_SMTP_PORT:XXXX}
spring.mail.username=${MAILERTOGO_SMTP_USER:XXXX}
spring.mail.password=${MAILERTOGO_SMTP_PASSWORD:XXXX}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAILER_FROM_EMAIL:XXXX}
admin.email=${ADMIN_EMAIL:XXXX}

# Application Base URL (for email links and redirects)
app.base-url=${APP_BASE_URL:XXXX}
