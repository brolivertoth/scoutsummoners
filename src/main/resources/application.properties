spring.application.name=ScoutSummoners

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:scoutsummoners.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Security
spring.security.user.name=XXXXX
spring.security.user.password=XXXXX

# Google reCAPTCHA Configuration
# Get your keys from: https://www.google.com/recaptcha/admin
recaptcha.site-key=XXXXX
recaptcha.secret-key=XXXXX
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Mailer To Go Email Configuration (for Heroku deployment)
# For Heroku: These are set automatically when you add the Mailer To Go addon
# For local development: Get values from: heroku config
spring.mail.host=${MAILERTOGO_SMTP_HOST:XXXXX}
spring.mail.port=${MAILERTOGO_SMTP_PORT:XXXXX}
spring.mail.username=${MAILERTOGO_SMTP_USER:XXXXX}
spring.mail.password=${MAILERTOGO_SMTP_PASSWORD:XXXXX}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAILER_FROM_EMAIL:XXXXX}
admin.email=XXXXX
